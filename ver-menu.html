    <style>
        :root {
            --bg-page: #e8f4fc;
            --bg-card: #ffffff;
            --border-card: #b6dbf5;
            --primary-navy: #0c2340;
            --accent-blue: #0284c7;
            --light-blue-bg: #e0f2fe;
            --light-blue-border: #93c5fd;
            --light-blue-text: #0369a1;
            --text-main: #0c2340;
            --text-muted: #52657d;
            --shadow-card: 0 4px 16px rgba(12, 35, 64, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(circle at 50% 0%, #ffffff 0%, transparent 75%),
                linear-gradient(180deg, #eaf4fc 0%, #dbeefa 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 18px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid var(--border-card);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 2px 8px rgba(12, 35, 64, 0.05);
        }

        .header-logo-link {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .header-logo-link:hover {
            transform: scale(1.03);
        }

        header img {
            height: 75px;
            width: 75px;
            object-fit: contain;
            border-radius: 50%;
            background: #ffffff;
            padding: 2px;
            box-shadow: 0 3px 10px rgba(2, 132, 199, 0.12);
            border: 2px solid var(--light-blue-border);
        }

        .container {
            flex: 1;
            width: 100%;
            max-width: 740px;
            padding: 26px 16px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .nav-categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
            padding-bottom: 10px;
            margin-bottom: 18px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            justify-content: flex-start;
        }

        @media (min-width: 540px) {
            .nav-categories {
                justify-content: center;
            }
        }

        .nav-categories::-webkit-scrollbar {
            display: none;
        }

        .nav-pill {
            padding: 9px 18px;
            background: #ffffff;
            border: 1px solid var(--border-card);
            border-radius: 9999px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s ease;
            box-shadow: 0 1px 3px rgba(12, 35, 64, 0.04);
        }

        .nav-pill:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .nav-pill.active {
            background: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
            box-shadow: 0 3px 8px rgba(2, 132, 199, 0.25);
        }

        .menu-hero-box {
            width: 100%;
            background-color: #ffffff;
            border-radius: 18px;
            border: 1px solid var(--border-card);
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .menu-overlay {
            background: #ffffff;
            padding: 28px 22px;
            border-radius: 18px;
            min-height: 280px;
        }

        .category-header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-card);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: var(--light-blue-bg);
            border: 1px solid var(--light-blue-border);
            border-radius: 9999px;
            color: var(--light-blue-text);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent-blue);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.8rem, 5vw, 2.4rem);
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
            color: var(--primary-navy);
        }

        .category-sub {
            font-size: 0.92rem;
            color: var(--text-muted);
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .menu-item-row {
            background: #f8fcff;
            border: 1px solid #a6d4f5;
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 1px 4px rgba(2, 132, 199, 0.05);
        }

        .menu-item-row:hover {
            background: #f0f8ff;
            border-color: #38bdf8;
            transform: translateX(2px);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1);
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary-navy);
            margin-bottom: 3px;
        }

        .item-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .item-price {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent-blue);
            background: var(--light-blue-bg);
            border: 1px solid var(--light-blue-border);
            padding: 6px 14px;
            border-radius: 10px;
            white-space: nowrap;
        }

        .drink-filter-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
            padding: 4px 2px 16px;
            margin-bottom: 6px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            justify-content: flex-start;
        }

        .drink-filter-container::-webkit-scrollbar {
            display: none;
        }

        @media (min-width: 540px) {
            .drink-filter-container {
                justify-content: center;
                flex-wrap: wrap;
            }
        }

        .drink-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 15px;
            background: #f0f7fc;
            border: 1px solid #cce3f5;
            border-radius: 9999px;
            color: var(--primary-navy);
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            transition: all 0.2s ease;
            box-shadow: 0 1px 3px rgba(12, 35, 64, 0.04);
            user-select: none;
        }

        .drink-pill:hover {
            background: #e0f0fa;
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .drink-pill.active {
            background: var(--primary-navy);
            color: #ffffff;
            border-color: var(--primary-navy);
            box-shadow: 0 3px 10px rgba(12, 35, 64, 0.25);
        }

        .drink-pill-count {
            background: rgba(2, 132, 199, 0.12);
            color: var(--accent-blue);
            font-size: 0.72rem;
            padding: 1px 7px;
            border-radius: 10px;
            font-weight: 800;
            transition: all 0.2s ease;
        }

        .drink-pill.active .drink-pill-count {
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
        }

        .type-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        .type-section:last-child {
            margin-bottom: 0;
        }

        .type-section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 4px 2px;
            margin-top: 4px;
        }

        .type-section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--primary-navy);
            letter-spacing: 0.4px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .type-section-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, #c8e1f5 0%, rgba(200, 225, 245, 0.05) 100%);
        }

        .type-section-badge {
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--light-blue-text);
            background: var(--light-blue-bg);
            border: 1px solid var(--light-blue-border);
            padding: 3px 8px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .items-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .loading-shimmer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-blue);
            color: #ffffff;
            padding: 14px 28px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 12px;
            transition: background 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .btn-volver:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }

        .btn-calificar-banner {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #ffffff;
            color: #b45309;
            border: 1px solid #fde68a;
            padding: 13px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 12px;
            margin-top: 14px;
            margin-bottom: 8px;
            width: 100%;

            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.15);

        .btn-calificar-banner:hover {
            background: #fef3c7;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
        }

        .floating-wsp {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #25d366;
            color: #ffffff;
            padding: 13px 22px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
            z-index: 999;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);

        .floating-wsp:hover {
            transform: translateY(-3px) scale(1.03);
            background: #20ba5a;
            box-shadow: 0 10px 26px rgba(37, 211, 102, 0.5);
            color: #ffffff;
        }

        .floating-wsp svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            flex-shrink: 0;
        }

        @media (max-width: 480px) {
            header {

            }

            header img {
                height: 65px;
                width: 65px;
            }

            .container {
                padding: 20px 12px 75px;
            }

            .menu-overlay {
                padding: 20px 14px;
                border-radius: 14px;
            }

            h2 {
                font-size: 1.65rem;
            }

            .drink-pill {
                padding: 7px 12px;
                font-size: 0.78rem;

            .type-section-title {
                font-size: 0.95rem;

            .menu-item-row {

            .item-name {
                font-size: 1.05rem;

            .item-desc {

            }

            .item-price {
                font-size: 1.05rem;

            }

            .btn-volver {
                width: 100%;
                justify-content: center;
                padding: 14px 18px;
            }

            .floating-wsp {
                bottom: 18px;
                right: 18px;
                padding: 11px 18px;
                font-size: 0.88rem;
            }

            .floating-wsp svg {
                width: 20px;
                height: 20px;
            }
        }

        footer {
            width: 100%;
            background: var(--primary-navy);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            text-align: center;
            padding: 28px 20px 24px;
            font-size: 0.85rem;
            margin-top: auto;
        }

        .footer-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;

        .footer-social {

            align-items: center;
            gap: 8px;
        }

        .footer-social-label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
        }

        .instagram-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.92rem;
            text-decoration: none;

        .instagram-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 20px rgba(220, 39, 67, 0.5);

        }

        .instagram-btn svg {
            width: 20px;

            fill: currentColor;

        .instagram-btn:hover svg {
            transform: rotate(-8deg) scale(1.1);
        }

        .footer-copy {
            font-size: 0.82rem;

            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 14px;
            width: 100%;
        }

        footer strong {
            color: #ffffff;
        }
    </style>
</head>

    <script>
        const params = new URLSearchParams(window.location.search);
        let selectedCategory = params.get('cat');
        let currentCategoryData = null;
        let activeDrinkFilter = 'all';

        function createItemRow(item) {
            const row = document.createElement('div');
            row.className = 'menu-item-row';
            row.innerHTML = `
                <div class="item-info">
                    <div class="item-name">${item.nombre}</div>
                    ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
                </div>
                ${item.precio ? `<div class="item-price">${item.precio}</div>` : ''}
            `;
            return row;
        }

        // Renderizado de items y subcategorias
        function renderCategoryItems(filteredType = 'all') {
            const listContainer = document.getElementById('items-list');
            if (!listContainer || !currentCategoryData) return;

            const items = currentCategoryData.items || [];
            if (items.length === 0) {
                listContainer.innerHTML = `
                    <div class="loading-shimmer" style="padding: 40px 20px; line-height: 1.6;">
                        <strong>Carta de ${currentCategoryData.titulo}</strong><br><br>
                        <span style="font-size:0.88rem; opacity:0.8;">Agrega las opciones y precios en tu Google Sheet (con categoria <code>${selectedCategory}</code>) y aparecerán aquí al instante.</span>
                    </div>
                `;
                return;
            }

            const hasTypes = items.some(i => i.tipo);

            if (hasTypes) {
                listContainer.innerHTML = '';

                if (filteredType === 'all') {
                    const groups = {};
                    items.forEach(item => {
                        const typeKey = item.tipo || 'otras';
                        if (!groups[typeKey]) {
                            groups[typeKey] = {
                                info: {
                                    nombre: item.tipoNombre || 'Otras',
                                    orden: item.tipoOrden || 99
                                },
                                items: []
                            };
                        }
                        groups[typeKey].items.push(item);
                    });

                    const sortedKeys = Object.keys(groups).sort((a, b) => groups[a].info.orden - groups[b].info.orden);

                    sortedKeys.forEach(typeKey => {
                        const group = groups[typeKey];
                        
                        const sectionEl = document.createElement('div');
                        sectionEl.className = 'type-section';

                        const headerEl = document.createElement('div');
                        headerEl.className = 'type-section-header';
                        headerEl.innerHTML = `
                            <span class="type-section-title">${group.info.nombre}</span>
                            <div class="type-section-line"></div>
                            <span class="type-section-badge">${group.items.length} ${group.items.length === 1 ? 'opción' : 'opciones'}</span>
                        `;
                        sectionEl.appendChild(headerEl);

                        const groupList = document.createElement('div');
                        groupList.className = 'items-group';

                        group.items.forEach(item => {
                            const row = createItemRow(item);
                            groupList.appendChild(row);
                        });

                        sectionEl.appendChild(groupList);
                        listContainer.appendChild(sectionEl);
                    });
                } else {
                    const filteredItems = items.filter(i => (i.tipo || 'otras') === filteredType);
                    
                    if (filteredItems.length === 0) {
                        listContainer.innerHTML = '<div class="loading-shimmer">No hay productos disponibles en esta sección.</div>';
                        return;
                    }

                    const firstItem = filteredItems[0];
                    const headerEl = document.createElement('div');
                    headerEl.className = 'type-section-header';
                    headerEl.style.marginBottom = '6px';
                    headerEl.innerHTML = `
                        <span class="type-section-title">${firstItem.tipoNombre || 'Variedad'}</span>
                        <div class="type-section-line"></div>
                        <span class="type-section-badge">${filteredItems.length} ${filteredItems.length === 1 ? 'opción' : 'opciones'}</span>
                    `;
                    listContainer.appendChild(headerEl);

                    const groupList = document.createElement('div');
                    groupList.className = 'items-group';

                    filteredItems.forEach(item => {
                        const row = createItemRow(item);
                        groupList.appendChild(row);
                    });

                    listContainer.appendChild(groupList);
                }
            } else {
                listContainer.innerHTML = '';
                items.forEach(item => {
                    const row = createItemRow(item);
                    listContainer.appendChild(row);
                });
            }
        }

        function setupDrinkFilters(items) {
            const filterContainer = document.getElementById('drink-filters');
            if (!filterContainer) return;

            const typesMap = new Map();
            items.forEach(item => {
                if (item.tipo && !typesMap.has(item.tipo)) {
                    typesMap.set(item.tipo, {
                        id: item.tipo,
                        nombre: item.tipoNombre || item.tipo,
                        orden: item.tipoOrden || 99
                    });
                }
            });

            const uniqueTypes = Array.from(typesMap.values()).sort((a, b) => a.orden - b.orden);

            if (uniqueTypes.length > 1) {
                filterContainer.style.display = 'flex';
                filterContainer.innerHTML = '';

                const allBtn = document.createElement('button');
                allBtn.type = 'button';
                allBtn.className = `drink-pill ${activeDrinkFilter === 'all' ? 'active' : ''}`;
                allBtn.innerHTML = `
                    <span class="drink-pill-title">Todas</span>
                    <span class="drink-pill-count">${items.length}</span>
                `;
                allBtn.addEventListener('click', () => {
                    activeDrinkFilter = 'all';
                    updateActiveDrinkFilterPills();
                    renderCategoryItems('all');
                });
                filterContainer.appendChild(allBtn);

                uniqueTypes.forEach(t => {
                    const count = items.filter(i => i.tipo === t.id).length;
                    const pill = document.createElement('button');
                    pill.type = 'button';
                    pill.className = `drink-pill ${activeDrinkFilter === t.id ? 'active' : ''}`;
                    pill.dataset.type = t.id;
                    pill.innerHTML = `
                        <span class="drink-pill-title">${t.nombre}</span>
                        <span class="drink-pill-count">${count}</span>
                    `;
                    pill.addEventListener('click', () => {
                        activeDrinkFilter = t.id;
                        updateActiveDrinkFilterPills();
                        renderCategoryItems(t.id);
                    });
                    filterContainer.appendChild(pill);
                });
            } else {
                filterContainer.style.display = 'none';
            }
        }

        function updateActiveDrinkFilterPills() {
            const pills = document.querySelectorAll('.drink-pill');
            pills.forEach(p => {
                if (p.dataset.type) {
                    p.classList.toggle('active', p.dataset.type === activeDrinkFilter);
                } else {
                    p.classList.toggle('active', activeDrinkFilter === 'all');
                }
            });
        }

        // Renderizado de datos del menu
        function renderMenuData(menuData) {
            const categoryKeys = Object.keys(menuData).filter(k => !k.startsWith('_'));

            if (categoryKeys.length === 0) {
                document.getElementById('items-list').innerHTML = '<div class="loading-shimmer">No hay productos cargados en la carta.</div>';
                return;
            }

            // Si la categoría pedida es alias o variante (ej. cocteleria o tragos) y existe bebidas
            if (selectedCategory && (selectedCategory.includes("coctel") || selectedCategory.includes("trag")) && menuData["bebidas"]) {
                selectedCategory = "bebidas";
            }

            if (!selectedCategory || !menuData[selectedCategory]) {
                selectedCategory = categoryKeys[0];
            }

            const wspBtn = document.getElementById('btn-wsp-flotante');
            if (wspBtn) {
                wspBtn.href = buildWhatsAppLink(selectedCategory);
            }

            const nav = document.getElementById('nav-categories');
            nav.innerHTML = '';
            categoryKeys.forEach(key => {
                const cat = menuData[key];
                const pill = document.createElement('a');
                pill.href = `ver-menu.html?cat=${encodeURIComponent(key)}`;
                pill.className = `nav-pill ${key === selectedCategory ? 'active' : ''}`;
                pill.id = `pill-${key}`;
                pill.textContent = cat.titulo;
                nav.appendChild(pill);
            });

            currentCategoryData = menuData[selectedCategory];
            document.title = `${currentCategoryData.titulo} • Rivera Club`;

            document.getElementById('cat-badge-text').textContent = currentCategoryData.tag || 'Rivera Club';
            document.getElementById('cat-title').textContent = currentCategoryData.titulo;
            document.getElementById('cat-sub').textContent = currentCategoryData.subtitulo || '';

            activeDrinkFilter = 'all';
            setupDrinkFilters(currentCategoryData.items || []);
            renderCategoryItems('all');
        }

        // Inicializacion de la carta con Stale-While-Revalidate
        function initMenu() {
            loadMenuWithStaleWhileRevalidate(
                (menuData) => {
                    renderMenuData(menuData);
                },
                (err) => {
                    console.error("Error al cargar la carta desde Google Sheets:", err);
                    document.getElementById('cat-badge-text').textContent = 'Rivera Club';
                    document.getElementById('cat-title').textContent = 'Carta no disponible';
                    document.getElementById('cat-sub').textContent = 'No se pudo sincronizar con Google Sheets';
                    document.getElementById('items-list').innerHTML = '<div class="loading-shimmer">No se pudo obtener la carta en tiempo real.<br><br><span style="font-size:0.85rem; opacity:0.8;">Por favor verifica tu conexión a internet o intenta nuevamente más tarde.</span></div>';
                }
            );
        }

        initMenu();
    </script>

</body>
